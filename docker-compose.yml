version: "3.9"

services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: fastapi-api
  #   ports:
  #     - "8000:80"
  #   environment:
  #     - REDIS_URL=redis://redis:6379
  #   volumes:
  #     - .:/app
  #   command: .venv/bin/fastapi dev --host 0.0.0.0 --port 80 --reload
  #   networks:
  #     - app-network
  #   depends_on:
  #     - redis

  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    networks:
      - app-network
  rq-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: rq-worker
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
    command: /app/.venv/bin/rq worker default
networks:
  app-network:
    driver: bridge