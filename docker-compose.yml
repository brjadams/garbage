version: "3.9"

services:

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540" # Or any other desired port for RedisInsight
    depends_on:
      - redis # Ensures Redis starts before RedisInsight

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-api
    ports:
      - "8000:80"
    environment:
      - REDIS_CONN_STRING=redis://redis:6379/
      - CLERK_ISSUER=https://immense-husky-73.clerk.accounts.dev
      - CLERK_JWKS_URL=https://immense-husky-73.clerk.accounts.dev/.well-known/jwks.json
      - CLERK_SECRET_KEY=sk_test_QXCpszmSj7GgtwQaYCbQDr7SnjdhsVcgNTWyceDlEg
      - POSTGRES_HOST=postgres
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    command: uv run fastapi dev --host 0.0.0.0 --port 80 --reload
    networks:
      - app-network
    depends_on:
      - redis

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    networks:
      - app-network

  rq-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: rq-worker
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
    volumes:
      - .:/app
    command: /app/.venv/bin/rq worker csv_to_db csv_to_redis_json embed_doc
networks:
  app-network:
    driver: bridge
